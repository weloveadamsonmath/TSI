    <p class="fine center">New numbers every time you press Next problem. Keys: A–D to pick, Enter to check.</p>`;
  const nx = MODS[m.n];
  h += `<div class="next-row"><span class="fine">${doneCount(m.skills)} of ${m.skills.length} skills checked off in this module.</span>${nx ? `<button class="btn ghost" data-act="go" data-go="${nx.n}">Next: Module ${nx.n}</button>` : '<button class="btn ghost" data-act="go" data-go="mix">Next: Mixed review</button>'}</div>`;
  return h;
}
function modulePage(n) {
  const m = MODS[n - 1], tab = S.tab[n] || 'learn';
  return `<header class="mod-head"><p class="eyebrow">Module ${m.n} of ${MODS.length} · <span class="cat c-${m.cat}">${CATS[m.cat].name}</span> ${CATS[m.cat].of} of the 20 test questions are ${CATS[m.cat].name.toLowerCase()}</p><h1>${m.title}</h1><p class="why">${m.why}</p>
    <div class="seg" role="tablist"><button role="tab" class="seg-learn" data-act="tab" data-tab="learn" aria-selected="${tab === 'learn'}"><span class="seg-n">1</span>Learn</button><span class="seg-arrow" aria-hidden="true">→</span><button role="tab" class="seg-prac" data-act="tab" data-tab="practice" aria-selected="${tab === 'practice'}"><span class="seg-n">2</span>Practice ${squares(m.skills)}</button></div></header>
    <div class="mod-body${tab === 'learn' ? ' has-float' : ''}">${tab === 'learn' ? learn(m) : practice(m)}</div>
    ${tab === 'learn' ? `<button class="float-prac" data-act="tab" data-tab="practice">Go to Practice <span aria-hidden="true">→</span></button>` : ''}`;
}

/* ---------- mixed review ---------- */
const MIX_N = 20;
const MIX_PLAN = { 1: 2, 2: 2, 3: 3, 4: 3, 5: 4, 6: 2, 7: 1, 8: 3 }; // 7 algebra, 6 numbers, 4 data, 3 geometry
function startMix() {
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let list = [];
  for (const m of MODS) list = list.concat(shuffle(m.skills).slice(0, MIX_PLAN[m.n] || 0));
  list = shuffle(list);
  S.mix = { list, i: 0, res: [], P: { p: E.generate(list[0]), sel: null, done: false, hint: false, steps: false } };
}
/* Rank the modules by need. A miss costs a point on the real test; a right answer that needed a hint
   counts half, because it might not hold up without one. The mix asks each module about as many questions
   as the real test does, so need is roughly the points that module would cost you. Ties go to the earlier
   module, because later modules build on it. */
function rankNeed(res) {
  const by = {};
  res.forEach((r, i) => { if (!E.SKILLS[r.sid]) return; const m = MOD_OF[r.sid]; (by[m.n] = by[m.n] || { m, qs: [] }).qs.push(Object.assign({ i }, r)); });
  const rows = Object.values(by).map(g => {
    const miss = g.qs.filter(q => !q.ok), shaky = g.qs.filter(q => q.ok && q.hint);
    const need = miss.length + shaky.length / 2, skills = [...new Set(miss.concat(shaky).map(q => q.sid))];
    return Object.assign(g, { miss: miss.length, shaky: shaky.length, need, skills });
  });
  const weak = rows.filter(g => g.need > 0).sort((a, b) => b.need - a.need || b.need / b.qs.length - a.need / a.qs.length || a.m.n - b.m.n);
  return { weak, strong: rows.filter(g => g.need === 0).sort((a, b) => a.m.n - b.m.n) };
}
const tabName = m => `<span class="tabn c-${m.cat}">${m.n}</span> ${m.short}`;
function report(res) {
  const right = res.filter(r => r.ok).length, N = res.length, { weak, strong } = rankNeed(res);
  const lead = right === N && !weak.length ? 'Every one right, with no hints. Take another set in a few days to keep it fresh.'
    : right >= 17 ? 'Strong. Clean up the area below, then take another set.'
    : right >= 13 ? 'Getting close. Study your top two areas, then take another set.'
    : 'Start with your first area below. Read <b>Learn</b> before you practice, then come back for another set.';
  let h = `<section class="report" aria-label="Study plan"><p class="score-line">You got <b>${right} of ${N}</b>. ${lead}</p>`;
  if (weak.length) {
    h += '<h2>What to study, most needed first</h2><ol class="need">';
    weak.forEach((g, k) => {
      const tag = k === 0 ? 'Study first' : k === 1 ? 'Study next' : 'Then';
      const stat = (g.miss ? [`Missed ${g.miss} of ${g.qs.length}`].concat(g.shaky ? [`${g.shaky} right with a hint`] : []) : [`All ${g.qs.length} right, but ${g.shaky === g.qs.length ? (g.shaky === 2 ? 'both' : 'all') : g.shaky} needed a hint`]).concat([`about ${MIX_PLAN[g.m.n]} of the 20 test questions`]);
      const marks = g.qs.map(q => `<i class="${q.ok ? (q.hint ? 'hint' : 'ok') : 'no'}" title="Question ${q.i + 1}: ${q.ok ? (q.hint ? 'right, with a hint' : 'right') : 'missed'}"></i>`).join('');
      h += `<li class="r${Math.min(k + 1, 3)}"><div class="need-top"><span class="need-rank">${k + 1}</span><div><p class="need-tag">${tag}</p>
        <h3>${tabName(g.m)}<span class="need-title">${g.m.title}</span></h3><p class="need-stat">${stat.join(' · ')}</p></div>
        <span class="qm" role="img" aria-label="${g.qs.length - g.miss} right, ${g.miss} missed">${marks}</span></div>
        <div class="chips"><button class="btn ghost sm" data-act="learn" data-n="${g.m.n}">Learn the moves</button>${g.skills.map(sid => `<button class="chip" data-act="drill" data-skill="${sid}">Practice: ${E.SKILLS[sid].name}</button>`).join('')}</div></li>`;
    });
    h += '</ol><p class="fine">Ranked by the points each area would cost you on the real test: a miss counts 1, and a right answer that needed a hint counts ½. Ties go to the earlier module, since later ones build on it.</p>';
  }
  if (strong.length) h += `<p class="strong-line"><b>Strong today:</b> ${strong.map(g => `<span class="strong-tab">${tabName(g.m)}</span>`).join(' ')}</p>`;
  h += `<details class="qlist"><summary>See all ${N} questions</summary><ol class="results">${res.filter(r => E.SKILLS[r.sid]).map((r, i) => `<li class="${r.ok ? 'ok' : 'no'}"><span class="rn">${i + 1}</span><span>${tabName(MOD_OF[r.sid])} · ${E.SKILLS[r.sid].name}${r.ok && r.hint ? ' <span class="fine">(hint)</span>' : ''}</span><span class="rk">${r.ok ? '✓' : '✗'}</span></li>`).join('')}</ol></details>`;
  return h + '</section>';
}
function lastMix() { const L = saved.mix; return L && Array.isArray(L.res) && L.res.length ? L : null; }
function mixPage() {
  let h = '<header class="mod-head"><p class="eyebrow">Final practice</p><h1>Mixed review</h1>';
  if (!S.mix) {
    const L = lastMix();
    h += `<p class="why">${MIX_N} problems in the same mix as the real test: 7 algebra, 6 numbers and percents, 4 data and probability, and 3 geometry. When you finish, you get a study plan that ranks what to work on first.</p></header><div class="next-row start"><button class="btn primary" data-act="mix-start">${L ? 'Start a new set' : 'Start the mixed review'}</button></div>`;
    if (L) h += `<h2 class="last-h">Your last study plan${L.at ? `, ${new Date(L.at).toLocaleDateString(undefined, { month: 'long', day: 'numeric' })}` : ''}</h2>` + report(L.res);
    return h;
  }
  const X = S.mix;
  if (X.i >= X.list.length) {
    h += '</header>' + report(X.res);
    return h + `<div class="next-row start"><button class="btn primary" data-act="mix-start">Try another set of ${MIX_N}</button></div>`;
  }
  h += `<p class="why">Question <b>${X.i + 1}</b> of ${X.list.length}</p></header>`;
  return h + `<div id="card">${card(X.P, { label: `Module ${MOD_OF[X.P.p.skill].n} · ${E.SKILLS[X.P.p.skill].name}`, next: X.i === X.list.length - 1 ? 'See my results' : 'Next question' })}</div>`;
}

/* ---------- distribution arrows ---------- */
function drawArcs() {
  document.querySelectorAll('.dist').forEach(el => {
    el.querySelectorAll('svg.arcs').forEach(s => s.remove());
    const box = el.getBoundingClientRect(); if (!box.width) return;
    const A = el.querySelector('.d-a').getBoundingClientRect(), fs = parseFloat(getComputedStyle(el).fontSize), H = fs * 1.2;
    const ax = A.left + A.width / 2 - box.left; let paths = '';
    el.querySelectorAll('.d-t').forEach((t, i) => {
      const r = t.getBoundingClientRect(), tx = r.left + r.width / 2 - box.left, h = H * (0.62 + 0.38 * i), cx = (ax + tx) / 2, cy = H - h * 1.7;
      const y0 = H - fs * 0.05, ex = tx, ey = y0, dx = ex - cx, dy = ey - cy, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len, s = fs * 0.32;
      paths += `<path class="arc" d="M${(ax + 2).toFixed(1)} ${y0.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${(ey - s * 0.6).toFixed(1)}"/>`;
      paths += `<path class="ah" d="M${ex.toFixed(1)} ${ey.toFixed(1)} L ${(ex - ux * s - uy * s * 0.55).toFixed(1)} ${(ey - uy * s + ux * s * 0.55).toFixed(1)} L ${(ex - ux * s + uy * s * 0.55).toFixed(1)} ${(ey - uy * s - ux * s * 0.55).toFixed(1)} Z"/>`;
    });
    el.insertAdjacentHTML('afterbegin', `<svg class="arcs" aria-hidden="true" width="${box.width.toFixed(0)}" height="${H.toFixed(0)}" style="top:${(-H).toFixed(0)}px">${paths}</svg>`);
  });
  drawWings();
}
function drawWings() {
  document.querySelectorAll('.bf').forEach(el => {
    el.querySelectorAll('svg.wings').forEach(s => s.remove());
    const box = el.getBoundingClientRect(); if (!box.width) return;
    const ctr = sel => { const r = el.querySelector(sel).getBoundingClientRect(); return [r.left + r.width / 2 - box.left, r.top + r.height / 2 - box.top, r.width, r.height]; };
    const A = ctr('.bf-a'), B = ctr('.bf-b'), C = ctr('.bf-c'), D = ctr('.bf-d');
    const seg = (P, Q, cls) => {
      const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
      const s1 = Math.min(P[2] / 2 / Math.abs(ux || 1e-6), P[3] / 2 / Math.abs(uy || 1e-6)) + 2, s2 = Math.min(Q[2] / 2 / Math.abs(ux || 1e-6), Q[3] / 2 / Math.abs(uy || 1e-6)) + 2;
      return `<line class="${cls}" x1="${(P[0] + ux * s1).toFixed(1)}" y1="${(P[1] + uy * s1).toFixed(1)}" x2="${(Q[0] - ux * s2).toFixed(1)}" y2="${(Q[1] - uy * s2).toFixed(1)}"/>`;
    };
    el.insertAdjacentHTML('afterbegin', `<svg class="wings" aria-hidden="true" width="${box.width.toFixed(0)}" height="${box.height.toFixed(0)}">${seg(A, D, 'w1')}${seg(B, C, 'w2')}</svg>`);
  });
}
let arcTimer; window.addEventListener('resize', () => { clearTimeout(arcTimer); arcTimer = setTimeout(() => { fitTop(); drawArcs(); }, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawArcs);

/* ---------- render + events ---------- */
function renderTabs() {
  const nav = document.getElementById('tabs'); if (!nav) return;
  nav.innerHTML = `<button class="tab" data-act="go" data-go="home" data-nav="home">Home</button>` + MODS.map(m => {
    const all = doneCount(m.skills) === m.skills.length;
    return `<button class="tab c-${m.cat}${all ? ' done' : ''}" data-act="go" data-go="${m.n}" data-nav="${m.n}" title="Module ${m.n}: ${m.title}${all ? ' (all skills checked off)' : ''}"><span class="n">${m.n}</span>${m.short}${all ? '<span class="tck" aria-label="all checked off">✓</span>' : ''}</button>`;
  }).join('');
  document.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', String(b.dataset.nav) === String(S.view) ? 'page' : 'false'));
  const cur = nav.querySelector('[aria-current="page"]');
  if (cur && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = cur.offsetLeft - nav.clientWidth / 2 + cur.offsetWidth / 2;
}
function fitTop() {
  const top = document.querySelector('.top'), inner = top && top.querySelector('.top-in'); if (!inner) return;
  top.classList.remove('stack');
  const kids = [...inner.children], need = kids.reduce((s, k) => s + k.scrollWidth, 0) + 12 * (kids.length - 1) + 2;
  if (need > inner.clientWidth) top.classList.add('stack');
}
function render(scrollTop) {
  renderTabs(); fitTop();
  app.innerHTML = S.view === 'home' ? home() : S.view === 'mix' ? mixPage() : modulePage(+S.view);
  if (scrollTop) window.scrollTo(0, 0);
  drawArcs();
}
function current() {
  if (S.view === 'mix') return S.mix && S.mix.i < S.mix.list.length ? { P: S.mix.P, mix: true } : null;
  const n = +S.view; if (n && S.tab[n] === 'practice') return { P: S.prac[n], n };
  return null;
}
function refreshCard() {
  const c = current(); if (!c) return render();
  if (c.mix) { render(); return; }
  document.getElementById('card').innerHTML = card(c.P, {});
  const st = document.getElementById('streak'); if (st) st.innerHTML = streakLine(c.P);
  document.querySelectorAll('.chip[data-skill]').forEach(b => { const s = b.dataset.skill; if (s !== 'mix') b.innerHTML = E.SKILLS[s].name + dots(s); });
  const seg = document.querySelector('.seg [data-tab="practice"]'); if (seg) seg.innerHTML = '<span class="seg-n">2</span>Practice ' + squares(MODS[c.n - 1].skills);
  drawArcs();
}
function check() {
  const c = current(); if (!c || c.P.done || c.P.sel === null) return;
  const P = c.P, ok = P.p.choices[P.sel].ok, st = stat(P.p.skill);
  P.done = true; st.t++;
  if (ok) { st.r++; if (!P.hint) st.s++; P.steps = true; } else st.s = 0;
  if (st.s >= 3) st.d = true;
  save();
  if (c.mix) S.mix.res.push({ sid: P.p.skill, ok, hint: !!P.hint });
  if (st.d) renderTabs();
  if (c.mix) render(); else refreshCard();
  const fb = document.querySelector('.fb'); if (fb) fb.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
function next() {
  const c = current(); if (!c) return;
  if (c.mix) { const X = S.mix; X.i++; if (X.i < X.list.length) X.P = { p: E.generate(X.list[X.i]), sel: null, done: false, hint: false, steps: false }; else { saved.mix = { at: Date.now(), res: X.res }; save(); } render(true); return; }
  newProblem(c.P, c.n); refreshCard();
  const card = document.getElementById('card'); if (card && card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: 'start' });
}
function go(v) { S.view = v; S.arm = false; S.erased = false; render(true); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, c = current();
  if (a === 'go') return go(b.dataset.go);
  if (a === 'learn') { const n = +b.dataset.n; S.tab[n] = 'learn'; go(String(n)); return; }
  if (a === 'tab') { S.tab[+S.view] = b.dataset.tab; render(true); return; }
  if (a === 'skill') { const n = +S.view; S.prac[n].src = b.dataset.skill; newProblem(S.prac[n], n); document.querySelectorAll('.chip[data-skill]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.skill === b.dataset.skill))); refreshCard(); return; }
  if (a === 'drill') { const sid = b.dataset.skill, n = MOD_OF[sid].n; S.tab[n] = 'practice'; S.prac[n] = { src: sid }; go(String(n)); return; }
  if (a === 'pick' && c && !c.P.done) { c.P.sel = +b.dataset.i; c.mix ? render() : refreshCard(); return; }
  if (a === 'hint' && c) { c.P.hint = true; c.mix ? render() : refreshCard(); return; }
  if (a === 'check') return check();
  if (a === 'steps' && c) { c.P.steps = !c.P.steps; c.mix ? render() : refreshCard(); return; }
  if (a === 'next') return next();
  if (a === 'mix-start') { startMix(); render(true); return; }
  if (a === 'ex-next' || a === 'ex-all' || a === 'ex-reset') {
    const id = b.dataset.ex, [mi, vi, ei] = id.split('-').map(Number), ex = MODS[mi - 1].moves[vi].ex[ei];
    S.ex[id] = a === 'ex-reset' ? 0 : a === 'ex-all' ? ex.steps.length : Math.min((S.ex[id] || 0) + 1, ex.steps.length);
    const el = document.getElementById('ex-' + id); el.outerHTML = exampleHTML(id, ex); drawArcs();
    const btn = document.querySelector(`#ex-${id} .ex-ctrl .btn`); if (btn) btn.focus({ preventScroll: true });
    return;
  }
  if (a === 'reset') { S.arm = true; S.erased = false; render(); document.getElementById('reset').scrollIntoView({ block: 'center' }); return; }
  if (a === 'reset-no') { S.arm = false; render(); document.getElementById('reset').scrollIntoView({ block: 'center' }); return; }
  if (a === 'reset-yes') { saved.st = {}; delete saved.mix; save(); S.arm = false; S.erased = true; S.prac = {}; S.mix = null; S.ex = {}; render(); document.getElementById('reset').scrollIntoView({ block: 'center' }); return; }
});
document.addEventListener('input', e => {
  if (e.target.dataset.act !== 'shift') return;
  S.shift.h = +document.getElementById('sh-h').value; S.shift.k = +document.getElementById('sh-k').value;
  document.getElementById('sh-plot').innerHTML = shiftPlot();
  document.getElementById('sh-eq').innerHTML = Rm(shiftEq());
  document.getElementById('sh-hd').textContent = hDesc(S.shift.h); document.getElementById('sh-kd').textContent = kDesc(S.shift.k);
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const c = current(); if (!c) return;
  const k = e.key.toLowerCase(), idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (idx >= 0 && !c.P.done) { c.P.sel = idx; c.mix ? render() : refreshCard(); e.preventDefault(); return; }
  if (k === 'enter' && !(tag === 'button' && e.target.closest('#card'))) { if (c.P.done) next(); else if (c.P.sel !== null) check(); else return; e.preventDefault(); }
});
render();
})();

</script>

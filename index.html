<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSI Math Bootcamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Layout: a test-prep notebook. Sticky module bar on top, one reading column on graph paper,
   bubble-sheet answer choices, highlighter for the one thing that matters (950). */
:root {
  --paper: #F3F6F9; --surface: #FFFFFF; --ink: #142039; --ink-soft: #46566F; --muted: #67758C;
  --line: #D2DCE6; --grid: #E3EAF1; --grid-strong: #CCD8E4;
  --blue: #2346C9; --on-blue: #FFFFFF; --blue-soft: #E6ECFC; --violet: #8B3DB9;
  --hi: #FFE14A; --hi-soft: #FFF1A6; --rose: #F2A9A4;
  --sel-bg: #E7ECF4; --sel-line: #9AA7BC; --cta-bg: #E3EAFF; --cta-line: #8FA6F2; --cta-ink: #2A47B8;
  --c-alg: #2346C9; --c-num: #8B3DB9; --c-data: #137A42; --c-geo: #B4530F;
  --p0: #AFC2F7; --p1: #DDBFF0; --p2: #FFE07A; --p3: #A8DDBE;
  --ok: #137A42; --ok-soft: #DDF2E5; --bad: #C1302B; --bad-soft: #FBE4E2;
  --shadow: rgba(20, 32, 57, .16);
  --f-display: 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0D1424; --surface: #151F35; --ink: #E7ECF5; --ink-soft: #B6C1D4; --muted: #8E9BB2;
  --line: #2A3651; --grid: #19243B; --grid-strong: #26334E;
  --blue: #8EA9FF; --on-blue: #0D1424; --blue-soft: #1C2A4C; --violet: #D2A4FF;
  --hi: #F0CF45; --hi-soft: rgba(240, 207, 69, .22); --rose: #8A3A3A;
  --sel-bg: #26324B; --sel-line: #56647F; --cta-bg: rgba(142, 169, 255, .16); --cta-line: #6F88D6; --cta-ink: #C3D2FF;
  --c-alg: #8EA9FF; --c-num: #D2A4FF; --c-data: #55CB8E; --c-geo: #FFAE6B;
  --p0: #3B54A6; --p1: #6B3F8C; --p2: #7D6A22; --p3: #2E7A52;
  --ok: #55CB8E; --ok-soft: rgba(85, 203, 142, .14); --bad: #FF8A82; --bad-soft: rgba(255, 138, 130, .14);
  --shadow: rgba(0, 0, 0, .45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0D1424; --surface: #151F35; --ink: #E7ECF5; --ink-soft: #B6C1D4; --muted: #8E9BB2;
  --line: #2A3651; --grid: #19243B; --grid-strong: #26334E;
  --blue: #8EA9FF; --on-blue: #0D1424; --blue-soft: #1C2A4C; --violet: #D2A4FF;
  --hi: #F0CF45; --hi-soft: rgba(240, 207, 69, .22); --rose: #8A3A3A;
  --sel-bg: #26324B; --sel-line: #56647F; --cta-bg: rgba(142, 169, 255, .16); --cta-line: #6F88D6; --cta-ink: #C3D2FF;
  --c-alg: #8EA9FF; --c-num: #D2A4FF; --c-data: #55CB8E; --c-geo: #FFAE6B;
  --p0: #3B54A6; --p1: #6B3F8C; --p2: #7D6A22; --p3: #2E7A52;
  --ok: #55CB8E; --ok-soft: rgba(85, 203, 142, .14); --bad: #FF8A82; --bad-soft: rgba(255, 138, 130, .14);
  --shadow: rgba(0, 0, 0, .45); color-scheme: dark; }

[hidden] { display: none !important; }
html { font-size: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 1.0625rem; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 52rem; margin: 0 auto; padding-inline: 1rem; }
@media (min-width: 720px) { .wrap { padding-inline: 1.5rem; } }
h1, h2, h3 { text-wrap: balance; }
p { margin: 0 0 .75rem; }
.eyebrow { font-family: var(--f-display); font-weight: 700; font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
.fine { font-size: .92rem; color: var(--ink-soft); }
.center { text-align: center; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); background: color-mix(in srgb, var(--paper) 90%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .75rem; min-height: 3.4rem; padding-block: .3rem; }
.brand { font-family: var(--f-display); font-weight: 800; font-stretch: 112%; font-size: 1.05rem; background: none; border: 0; padding: .3rem 0; cursor: pointer; white-space: nowrap; }
.brand span { background: linear-gradient(transparent 55%, var(--hi-soft) 55% 90%, transparent 90%); }
.tabs { display: flex; gap: .2rem; overflow-x: auto; flex: 0 1 auto; min-width: 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { white-space: nowrap; background: var(--surface); border: 1.5px solid var(--grid-strong); border-radius: 999px; padding: .36rem .62rem; color: var(--ink); font-weight: 700; font-size: .88rem; cursor: pointer; box-shadow: 0 1px 0 var(--grid-strong); }
.tab:hover { border-color: var(--ink-soft); }
.tab .n { font-family: var(--f-display); font-weight: 800; margin-right: .3rem; color: var(--muted); }
.tab[aria-current="page"] { background: var(--ink); color: var(--paper); border-color: var(--ink); box-shadow: none; }
.tab[aria-current="page"] .n { color: var(--hi); }
.tab.c-alg .n { color: var(--c-alg); } .tab.c-num .n { color: var(--c-num); } .tab.c-data .n { color: var(--c-data); } .tab.c-geo .n { color: var(--c-geo); }
.tab[aria-current="page"][class*="c-"] .n { color: var(--hi); }
.tab .tck { margin-left: .35rem; color: var(--ok); font-weight: 900; }
.tab[aria-current="page"] .tck { color: var(--hi); }
.top.stack .tabs { order: 3; flex: 1 1 100%; }
.top.stack .mixbtn { margin-left: auto; }
@media (min-width: 641px) { .top.stack .tabs { flex-wrap: wrap; overflow: visible; -webkit-mask-image: none; mask-image: none; padding-right: 0; } }
.mixbtn { flex: none; white-space: nowrap; border: 2px solid var(--blue); background: var(--surface); color: var(--blue); border-radius: 999px; font-weight: 800; font-size: .9rem; padding: .38rem .9rem; cursor: pointer; }
.mixbtn:hover { background: var(--blue-soft); }
.mixbtn[aria-current="page"] { background: var(--blue); color: var(--on-blue); }
.tabs { padding-block: 3px; }
.top .wrap { max-width: 88rem; }
@media (max-width: 760px) { .tabs { -webkit-mask-image: linear-gradient(to right, #000 82%, transparent); mask-image: linear-gradient(to right, #000 82%, transparent); padding-right: 1.5rem; } }
@media (max-width: 640px) { .top:not(.stack) .brand { display: none; } }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: .55rem; justify-content: center; font-weight: 700; font-size: 1rem; line-height: 1.1; padding: .78rem 1.2rem; min-height: 2.9rem; border-radius: 999px; border: 1.5px solid transparent; cursor: pointer; text-align: center; transition: transform .08s ease, background-color .15s ease; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--blue); color: var(--on-blue); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: var(--surface); border: 2px solid var(--ink-soft); color: var(--ink); box-shadow: 0 2px 0 var(--grid-strong); }
.btn.ghost:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { min-height: 2.4rem; padding: .55rem .95rem; font-size: .92rem; }
.btn .cnt { font-weight: 400; opacity: .85; font-size: .82em; font-variant-numeric: tabular-nums; padding-left: .55rem; border-left: 1px solid currentColor; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: .9rem; padding: .5rem; }

/* math */
.m { white-space: nowrap; font-variant-numeric: lining-nums; }
.m i { font-style: italic; padding-right: .05em; }
.m sup { font-size: .68em; line-height: 0; position: relative; top: -.1em; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .86em; line-height: 1.15; margin: 0 .12em; }
.fr .nu { border-bottom: .09em solid currentColor; padding: 0 .2em .05em; }
.fr .de { padding: .05em .2em 0; }
.fr .de:has(sup) { padding-top: .3em; } .fr .nu:has(sup) { padding-top: .25em; }
.m .fn { font-style: normal; }
.tick { color: var(--ok); font-weight: 700; }

/* home */
.hero { position: relative; margin-block: 1.5rem 2.25rem; padding: clamp(1.25rem, 5vw, 2.75rem); border: 2px solid var(--rose); border-radius: 16px; background: var(--surface); }
.hero h1 { position: relative; z-index: 0; isolation: isolate; font-family: var(--f-display); font-weight: 900; font-stretch: 115%; font-size: clamp(3rem, 11vw, 6rem); line-height: .92; letter-spacing: -.015em; margin: .2rem 0 1.1rem; }
.score { position: relative; display: inline-block; padding: 0 .06em; font-variant-numeric: lining-nums; }
.score::before { content: ""; position: absolute; z-index: -1; left: -.05em; right: -.05em; bottom: .04em; height: .44em; background: var(--hi); border-radius: .06em .14em .08em .12em; transform: rotate(-1.6deg) skewX(-10deg); }
:root[data-theme="dark"] .score::before { opacity: .9; }
.lede { font-size: 1.15rem; max-width: 36rem; color: var(--ink-soft); }
.hero-row { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 1.5rem; margin-top: 1.25rem; }
.meter { display: flex; flex-wrap: wrap; align-items: center; gap: .55rem; }
.meter-t { font-size: .92rem; color: var(--ink-soft); }
.sq { display: inline-flex; gap: 3px; vertical-align: middle; }
.sq i { width: .7rem; height: .7rem; border-radius: 2px; border: 1.5px solid var(--grid-strong); background: var(--surface); }
.sq i.on { background: var(--ok); border-color: var(--ok); }
.block { margin-block: 2.25rem; }
.block h2 { font-family: var(--f-display); font-weight: 800; font-stretch: 108%; font-size: 1.45rem; margin: 0 0 .9rem; }
.facts { list-style: none; margin: 0 0 .75rem; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.facts li { padding: 1rem 1.1rem; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.facts b { display: block; font-family: var(--f-display); font-weight: 800; font-stretch: 110%; font-size: 1.35rem; line-height: 1.1; margin-bottom: .3rem; }
.facts span { font-size: .95rem; color: var(--ink-soft); }
.agenda { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.agenda li { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto; gap: .9rem; align-items: center; padding: .85rem 0; border-bottom: 1px solid var(--line); }
.agenda .at { font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); }
.ag-main { min-width: 0; display: grid; gap: .1rem; }
.ag-title { justify-self: start; background: var(--surface); border: 2px solid var(--ink-soft); border-radius: 999px; padding: .3rem .85rem; text-align: left; font-weight: 700; font-size: 1.05rem; cursor: pointer; box-shadow: 0 2px 0 var(--grid-strong); text-decoration: none; text-decoration-color: var(--grid-strong); text-underline-offset: 4px; }
.ag-title:hover { border-color: var(--blue); }
.ag-title.plain { text-decoration: none; cursor: default; background: none; border: 0; box-shadow: none; padding: 0; }
.ag-n { font-family: var(--f-display); font-weight: 800; margin-right: .45rem; color: var(--blue); }
.ag-note { font-size: .92rem; color: var(--ink-soft); }
.agenda li.brk .ag-title, .agenda li.end .ag-title { color: var(--muted); }
.habits { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); }
.habit { display: flex; gap: .85rem; padding: 1rem 1.1rem; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.habit h3 { margin: 0 0 .25rem; font-size: 1.05rem; }
.habit p { margin: 0; color: var(--ink-soft); font-size: .97rem; }
.hn { flex: none; font-family: var(--f-display); font-weight: 900; font-size: 1.6rem; line-height: 1; color: var(--blue); width: 1.4rem; }
.teacher { border: 1px dashed var(--grid-strong); border-radius: 12px; padding: .9rem 1.1rem; }
.teacher summary { cursor: pointer; font-weight: 700; }
.teacher ul { margin: .75rem 0 0; padding-left: 1.2rem; display: grid; gap: .45rem; color: var(--ink-soft); }
.reset { text-align: center; margin-block: 1rem 3rem; display: grid; justify-items: center; gap: .5rem; }
.reset p { margin: 0; }
.reset-row { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; }
.erased { color: var(--ok); font-weight: 700; }

/* module pages */
.mod-head { padding-block: 1.75rem .5rem; }
.mod-head h1 { font-family: var(--f-display); font-weight: 900; font-stretch: 112%; font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1; margin: 0 0 .8rem; letter-spacing: -.01em; }
.why { font-size: 1.1rem; color: var(--ink-soft); max-width: 40rem; }
.seg { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-top: .6rem; }
.seg button { display: inline-flex; align-items: center; gap: .6rem; border-radius: 999px; padding: .65rem 1.25rem .65rem .7rem; font-weight: 800; font-size: 1.08rem; cursor: pointer; border: 2px solid var(--sel-line); background: var(--surface); color: var(--ink); box-shadow: 0 2px 0 var(--grid-strong); }
.seg-n { display: grid; place-items: center; width: 1.65rem; height: 1.65rem; border-radius: 50%; font-family: var(--f-display); font-size: .85rem; background: var(--grid); color: var(--ink); }
.seg-arrow { font-size: 1.3rem; color: var(--muted); }
.seg .seg-prac[aria-selected="false"] { border-color: var(--cta-line); background: var(--cta-bg); color: var(--cta-ink); box-shadow: 0 2px 0 var(--cta-line); }
.seg .seg-prac[aria-selected="false"] .seg-n { background: var(--cta-ink); color: var(--surface); }
.seg .seg-prac[aria-selected="false"] .sq i:not(.on) { background: transparent; border-color: var(--cta-line); }
.seg button[aria-selected="true"] { background: var(--sel-bg); color: var(--ink); border-color: var(--sel-line); box-shadow: inset 0 2px 0 color-mix(in srgb, var(--sel-line) 35%, transparent); }
.seg button[aria-selected="true"] .seg-n { background: var(--hi); color: #142039; }
.seg button[aria-selected="true"] .sq i:not(.on) { background: transparent; border-color: var(--sel-line); }
.seg button:hover { filter: brightness(1.06); }
@media (max-width: 480px) { .seg { gap: .35rem; } .seg-arrow { display: none; } .seg button { font-size: .98rem; padding: .55rem .95rem .55rem .5rem; gap: .45rem; } .seg-n { width: 1.45rem; height: 1.45rem; } }
.float-prac { position: fixed; z-index: 20; right: max(1rem, env(safe-area-inset-right, 0px)); bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: .5rem; padding: .8rem 1.3rem; border-radius: 999px; border: 2px solid var(--cta-line); background: var(--cta-bg); background: color-mix(in srgb, var(--cta-bg) 100%, var(--surface)); color: var(--cta-ink); font-weight: 800; font-size: 1rem; cursor: pointer; box-shadow: 0 10px 24px -8px var(--shadow), 0 2px 0 var(--cta-line); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.float-prac:hover { filter: brightness(1.08); }
.mod-body.has-float { padding-bottom: 5rem; }
.mod-body { padding-block: 1rem 3rem; }
.move { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 1rem; padding-block: 1.75rem; border-top: 1px solid var(--line); }
.move:first-child { border-top: 0; }
.move-n { width: 2.3rem; height: 2.3rem; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--paper); font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
.move-body { min-width: 0; }
.move h2 { font-family: var(--f-display); font-weight: 800; font-stretch: 106%; font-size: 1.5rem; line-height: 1.15; margin: .2rem 0 .5rem; }
.rule { font-size: 1.08rem; max-width: 40rem; }
@media (max-width: 520px) { .move { grid-template-columns: minmax(0, 1fr); } .move-n { margin-bottom: .5rem; width: 2rem; height: 2rem; font-size: 1rem; } }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; margin-block: .9rem; }
.ex-q { font-size: 1.1rem; font-weight: 700; margin-bottom: .25rem; }
.tag { display: inline-block; font-family: var(--f-display); font-weight: 800; font-size: .7rem; letter-spacing: .09em; text-transform: uppercase; color: var(--blue); background: var(--blue-soft); border-radius: 4px; padding: .15rem .4rem; vertical-align: .15em; margin: 0 .35rem .25rem 0; }
.steps { list-style: none; counter-reset: st; margin: .6rem 0 0; padding: 0; display: grid; gap: .55rem; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); column-gap: .6rem; }
.steps li::before { content: counter(st); grid-row: span 2; width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 1.5px solid var(--grid-strong); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: .8rem; color: var(--muted); }
.say { grid-column: 2; }
.sm { grid-column: 2; display: block; font-size: 1.22rem; margin-top: .15rem; overflow-x: auto; padding-bottom: .1rem; }
.steps span.sm > .m { white-space: normal; }
.ex-ctrl { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .9rem; }
.watch { margin-top: 1rem; max-width: 40rem; }
.pen { font-family: var(--f-display); font-weight: 800; font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--bad); margin-right: .35rem; border-bottom: 2px solid var(--bad); }
.tblwrap { overflow-x: auto; margin-block: .75rem 1rem; }
.words { border-collapse: collapse; min-width: 18rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.words th, .words td { padding: .5rem .85rem; border-bottom: 1px solid var(--line); text-align: left; }
.words th { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); background: var(--paper); }
.words tr:last-child td { border-bottom: 0; }
.words .sym { font-size: 1.35rem; font-weight: 700; text-align: center; color: var(--blue); }
.xy { border-collapse: collapse; margin-inline: auto; font-size: 1.15rem; font-variant-numeric: tabular-nums; background: var(--surface); }
.xy th, .xy td { border: 1px solid var(--grid-strong); padding: .45rem .95rem; text-align: center; }
.xy th { background: var(--paper); }
.figrow { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.25rem; margin-block: .5rem; }
.figrow .plot { margin: 0; max-width: 16rem; }
.figcap { flex: 1; min-width: 12rem; margin: 0; line-height: 1.9; }
.key { display: inline-block; width: 1.4rem; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: .5rem; background: var(--blue); }
.key.k2 { background: var(--violet); }
.shift { display: grid; grid-template-columns: minmax(0, 17rem) minmax(0, 1fr); gap: 1rem 1.5rem; align-items: center; margin-block: .75rem 1rem; padding: 1rem; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.shift .plot { margin: 0; }
.shift-ctl { display: grid; gap: .35rem; min-width: 0; }
.shift-eq { font-size: 1.55rem; margin-bottom: .4rem; }
.shift-ctl input[type="range"] { width: 100%; accent-color: var(--blue); margin-bottom: .5rem; }
@media (max-width: 600px) { .shift { grid-template-columns: minmax(0, 1fr); } .shift .plot { max-width: 17rem; margin-inline: auto; } }
.tip { margin-top: 1.5rem; padding: 1.1rem 1.25rem; border-radius: 12px; background: var(--hi-soft); }
.tip-h { font-family: var(--f-display); font-weight: 800; font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; margin-bottom: .3rem; }
.tip p:last-child { margin: 0; }
.next-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .75rem; margin-top: 1.5rem; }
.next-row.start { justify-content: flex-start; }

/* practice */
.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0 .5rem; }
.chip { display: inline-flex; align-items: center; gap: .55rem; padding: .5rem .85rem; border-radius: 999px; border: 2px solid var(--ink-soft); background: var(--surface); font-weight: 700; font-size: .92rem; cursor: pointer; }
.chip:hover { border-color: var(--ink-soft); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--blue-soft); }
.dots { display: inline-flex; gap: 3px; }

(function (root) {

const plural = (n, w, ws) => ns(n) + ' ' + (Math.abs(n) === 1 ? w : (ws || w + 's'));

const times = m => m === 2 ? 'twice' : `${WORDS[m]} times`;

      y0 !== 0 ? { m: P2(x0, -y0), why: W(x0, -y0, 'The x-value is right. Recheck the sign of y.') } : null,

    (kind === 'inf' ? 'That is the same line as the first one, so every point on it works.' : kind === 'none' ? 'Same slope, different y-intercept: the lines are parallel and never meet.' : 'The slopes are different, so the lines cross at exactly one point.');
  const cands = ['one', 'none', 'inf', 'two'].filter(c => c !== kind).map(c => ({ t: COUNT_TXT[c], why: (c === 'two' ? 'Two different straight lines can cross at most once. ' : '') + truth }));

    [`Divide every term by ${N(k)}.`, `y = ${lin([[m2, 'x'], [b2, '']])}`],
    [kind === 'inf' ? 'Same slope and same intercept as the first line. It is the same line: infinitely many solutions.' : kind === 'none' ? `Same slope (${N(m)}) but different intercepts (${N(b)} and ${N(b2)}). Parallel lines never cross: no solution.` : `Different slopes (${N(m)} and ${N(m2)}). The lines cross once: exactly one solution.`, null]];

}

function s2a() {
  const t = rint(1, 5), k = rint(2, 12), m = rint(2, 6);
  let sent, ans, ds, T, steps, hint;
  if (t === 1) {
    const lo = Math.ceil((k + 1) / m), n = rint(lo, lo + 10); T = m * n - k;
    sent = `${k} less than ${times(m)} a number is ${T}.`; ans = `${m}n - ${k} = ${T}`;
    ds = [[`${k} - ${m}n = ${T}`, `“Less than” flips the order. “${k} less than ${times(m)} a number” starts with \`${m}n\` and takes away ${k}.`],
      [`${m}(n - ${k}) = ${T}`, `The ${k} is subtracted <b>after</b> you multiply, so there are no parentheses.`],
      [`${m}n + ${k} = ${T}`, '“Less than” means subtract, not add.']];
    hint = `“Less than” flips the order: “${k} less than y” means \`y - ${k}\`.`;
    steps = [[`“${cap(times(m))} a number” is \`${m}n\`. “${k} less than” that is \`${m}n - ${k}\`. “Is” means =.`, ans], [`Bonus: solve it. Add ${k} to both sides.`, { t: 'bal', L: [[m, 'n'], [-k, '']], R: [[T, '']], op: [k, ''] }], [`Divide both sides by ${m}.`, { t: 'bal', L: [[m, 'n']], R: [[T + k, '']], div: m }]];
  } else if (t === 2) {
    const n = rint(1, 12); T = m * n + k;
    sent = `${k} more than ${times(m)} a number is ${T}.`; ans = `${m}n + ${k} = ${T}`;
    ds = [[`${m}(n + ${k}) = ${T}`, `The ${k} is added <b>after</b> you multiply, so there are no parentheses.`],
      [`${m}n - ${k} = ${T}`, '“More than” means add.'],
      k !== m && (T - m) / k !== n ? [`${k}n + ${m} = ${T}`, `The number is multiplied by ${m}, and then ${k} is added.`] : null,
      T - m - k !== n ? [`${m} + n + ${k} = ${T}`, `“${cap(times(m))}” means multiply.`] : null,
      [`${m}n = ${T} + ${k}`, `The ${k} belongs with \`${m}n\` on the left side. The sentence adds it to ${times(m)} the number.`]];
    hint = `Build it in order: first “${times(m)} a number,” then add ${k}.`;
    steps = [[`“${cap(times(m))} a number” is \`${m}n\`. “${k} more than” that is \`${m}n + ${k}\`. “Is” means =.`, ans], [`Bonus: solve it. Subtract ${k} from both sides.`, { t: 'bal', L: [[m, 'n'], [k, '']], R: [[T, '']], op: [-k, ''] }], [`Divide both sides by ${m}.`, { t: 'bal', L: [[m, 'n']], R: [[T - k, '']], div: m }]];
  } else if (t === 3) {
    const n = rint(1, 10); T = m * (n + k);
    sent = `${cap(times(m))} the sum of a number and ${k} is ${T}.`; ans = `${m}(n + ${k}) = ${T}`;
    ds = [[`${m}n + ${k} = ${T}`, `“The sum of a number and ${k}” has to be added first. Parentheses keep the sum together.`],
      [`${m}(n - ${k}) = ${T}`, '“Sum” means add.'],
      [`${m} + n + ${k} = ${T}`, `“${cap(times(m))}” means multiply.`]];
    hint = '“The sum of a number and …” is one group. Put it in parentheses before you multiply.';
    steps = [[`“The sum of a number and ${k}” is \`n + ${k}\`. ${cap(times(m))} that sum needs parentheses.`, ans], [`Bonus: solve it. Divide by ${m}, then subtract ${k}.`, `n = ${n}`]];
  } else if (t === 4) {
    T = rint(2, 9); const n = m * T + k;
    sent = `The difference of a number and ${k}, divided by ${m}, is ${T}.`; ans = `{n - ${k}/${m}} = ${T}`;
    ds = [[`n - {${k}/${m}} = ${T}`, `The whole difference gets divided by ${m}, so all of \`n - ${k}\` goes on top of the fraction.`],
      [`{${k} - n/${m}} = ${T}`, `“The difference of a number and ${k}” is \`n - ${k}\`, in that order.`],
      [`${m}(n - ${k}) = ${T}`, '“Divided by” means divide, not multiply.']];
    hint = `“The difference of a number and ${k}” is \`n - ${k}\`. The comma tells you the whole difference is divided.`;
    steps = [[`“The difference of a number and ${k}” is \`n - ${k}\`. Divide that whole group by ${m}.`, ans], [`Bonus: solve it. Multiply by ${m}, then add ${k}.`, `n = ${n}`]];
  } else {
    T = null;
    sent = `A number decreased by ${k} is equal to ${times(m)} the number.`; ans = `n - ${k} = ${m}n`;
    ds = [[`${k} - n = ${m}n`, `“A number decreased by ${k}” starts with the number: \`n - ${k}\`.`],
      [`n - ${k} = ${m} + n`, `“${cap(times(m))} the number” is a product: \`${m}n\`.`],
      [`n = ${m}n - ${k}`, `The ${k} is taken away from n on the <b>left</b> side.`]];
    hint = '“Decreased by” means subtract, and the number comes first. “Is equal to” is the equals sign.';
    steps = [[`Left side: “a number decreased by ${k}” is \`n - ${k}\`. Right side: “${times(m)} the number” is \`${m}n\`.`, ans]];
  }
  const cands = ds.filter(Boolean).map(([mm, why]) => ({ m: mm, why }));
  return { q: 'Let `n` be the number. Which equation matches this sentence?', quote: sent, big: [], choices: mc({ m: ans }, cands, () => null), hint, steps,
    spec: { type: 'translate', t, k, m, T } };
}

function s2b() {

        watch: 'Divide every term, including the 12. A common wrong answer leaves it as 12.' },
      { t: 'Systems: where two lines meet', rule: 'The solution to a system is the one point that works in both equations. On a graph, it is where the two lines cross.', fig: 'system',
        ex: [{ q: 'Solve `y = 2x + 1` and `y = -x + 7`.', steps: [['Both equal y, so set the right sides equal.', '2x + 1 = -x + 7'], ['Add `x` to both sides.', { t: 'bal', L: [[2, 'x'], [1, '']], R: [[-1, 'x'], [7, '']], op: [1, 'x'] }], ['Subtract 1 from both sides.', { t: 'bal', L: [[3, 'x'], [1, '']], R: [[7, '']], op: [-1, ''] }], ['Divide both sides by 3.', { t: 'bal', L: [[3, 'x']], R: [[6, '']], div: 3 }], ['Plug x back in to find y.', 'y = 2(2) + 1 = 5'], ['The lines meet at `(2, 5)`. Check the other equation: `-2 + 7 = 5` ✓', null]] },
          { q: 'Solve `x + y = 10` and `x - y = 4`.', steps: [['Stack the equations and add them. The y-terms are opposites, so they cancel.', { t: 'stack', e1: { L: [[1, 'x'], [1, 'y']], R: [[10, '']] }, e2: { L: [[1, 'x'], [-1, 'y']], R: [[4, '']] }, op: '+' }], ['Divide both sides by 2.', { t: 'bal', L: [[2, 'x']], R: [[14, '']], div: 2 }], ['Plug `x = 7` into `x + y = 10`.', '7 + y = 10'], ['Subtract 7 from both sides. The solution is `(7, 3)`.', { t: 'bal', L: [[7, ''], [1, 'y']], R: [[10, '']], op: [-7, ''], keysL: ['c', 'y'] }]] },
          { q: 'Shortcut: is `(4, -5)` the solution of `2a - b = 13` and `-a - b = 1`?', steps: [['Plug in a = 4 and b = −5 (in parentheses) to the first equation.', '2(4) - (-5) = 8 + 5 = 13 ✓'], ['It has to work in the second equation too.', '-(4) - (-5) = -4 + 5 = 1 ✓'], ['It works in both, so `(4, -5)` is the solution. On the test, try each answer choice this way instead of solving.', null]] }],
        watch: 'How many solutions? Different slopes: exactly one. Same slope with different intercepts: none, because the lines are parallel. Same line: infinitely many.' }],
    tip: 'Plug in the choices. The right answer makes the equation true, so test each choice and cross out the ones that fail. For a system, the right point works in <b>both</b> equations.' },

  { n: 2, title: 'Expressions: Build, Multiply, Factor', short: 'Expressions', cat: 'alg', skills: ['ex1', 'ex2', 'ex3', 'ex5', 'ex6', 'ex7', 'ex4'],
    why: 'Four of College Board’s 20 sample questions are about expressions, and practice tests add FOIL and factoring on top. Most of these fall to one trick: plug in a number.',
    moves: [
      { t: 'Words into math', rule: '“More than” adds. “Times” and “twice” multiply. “Less than” subtracts <b>and flips the order</b>. Build the expression in the order things happen.', words: true,
        ex: [{ q: 'A theater sold t tickets on Friday. On Saturday it sold 10 more than twice Friday’s number. Write Saturday’s tickets.', steps: [['“Twice Friday’s number” is `2t`.', '2t'], ['“10 more than” that adds 10.', '2t + 10'], ['Test it: if t = 5, Saturday is 2(5) + 10 = 20.', '2(5) + 10 = 20']] },
          { q: 'Last year a coach gave s lessons. This year: 5 more than 3 times last year. Next year: twice this year. Write next year’s lessons.', steps: [['This year: 3 times s, plus 5.', '3s + 5'], ['Next year is twice <b>all</b> of this year, so the 2 multiplies both terms.', '2(3s + 5) = 6s + 10']] }],
        watch: '“5 less than twice w” is `2w - 5`, not `5 - 2w`. And “twice this year” doubles everything: `2(3s + 5)` is `6s + 10`, not `6s + 5`.' },
      { t: 'Consecutive integers', rule: 'In a row: n, n + 1, n + 2. Even or odd in a row: n, n + 2, n + 4. If the question names the <b>greatest</b> one, count down instead: a, a − 2.',
        ex: [{ q: 'If n is the least of three consecutive integers, write their sum.', steps: [['List them.', 'n, n + 1, n + 2'], ['Add them and combine like terms.', 'n + (n + 1) + (n + 2) = 3n + 3'], ['Test it with 4, 5, 6: they add to 15, and `3(4) + 3 = 15` ✓', null]] },
          { q: 'If a is the greater of two consecutive even integers, write their sum.', steps: [['a is the bigger one, so count down by 2.', 'a, a - 2'], ['Add them.', 'a + (a - 2) = 2a - 2']] },
          { q: 'Three consecutive even integers add up to 54. What is the smallest?', steps: [['Let n be the smallest.', 'n + (n + 2) + (n + 4) = 54'], ['Combine like terms.', '3n + 6 = 54'], ['Subtract 6 from both sides.', { t: 'bal', L: [[3, 'n'], [6, '']], R: [[54, '']], op: [-6, ''] }], ['Divide by 3. Check: 16 + 18 + 20 = 54 ✓', { t: 'bal', L: [[3, 'n']], R: [[48, '']], div: 3 }]] }],
        watch: 'Even and odd integers in a row go up by 2, not 1. That’s true for odd ones too: 7, 9, 11.' },
      { t: 'Simplify, then factor out the GCF', rule: 'Distribute, combine like terms, then factor out the biggest number that goes into <b>every</b> term.',
        ex: [{ q: 'Simplify `4(x + 3) + 2(x + 6)`, then factor out the greatest common factor.', steps: [['Distribute each number to both terms in its parentheses.', '4x + 12 + 2x + 12'], ['Combine like terms.', '6x + 24'], ['6 goes into both 6 and 24. Factor it out.', '6x + 24 = 6(x + 4)']] },
          { q: 'Which expression is equivalent to `5(x + 6) + 5x + 5`?', steps: [['Distribute the 5.', '5x + 30 + 5x + 5'], ['Combine like terms.', '10x + 35'], ['Every term has a 5. Factor it out.', '10x + 35 = 5(2x + 7)']] }],
        watch: 'Factor out of <b>every</b> term. In `10x + 35 = 5(2x + 7)`, the 35 becomes 7.' },
      { t: 'FOIL: multiply two binomials', rule: 'Each term in the first parentheses multiplies each term in the second: <b>F</b>irst, <b>O</b>uter, <b>I</b>nner, <b>L</b>ast. Then combine the two middle terms.',
        ex: [{ q: 'Multiply `(x + 3)(x - 5)`.', steps: [['FOIL: First, Outer, Inner, Last. Keep the sign with each number.', { t: 'foil', a: 1, b: 3, c: 1, d: -5 }], ['The middle terms combine: `-5x + 3x = -2x`.', 'x^2 - 2x - 15']] },
          { q: 'Multiply `(2x - 4)(x + 2)`.', steps: [['FOIL.', { t: 'foil', a: 2, b: -4, c: 1, d: 2 }], ['The middle terms cancel: `4x - 4x = 0`.', '2x^2 - 8']] },
          { q: 'Multiply `(x + 4)^2`.', steps: [['Squaring means multiplying it by itself: `(x + 4)(x + 4)`.', null], ['FOIL.', { t: 'foil', a: 1, b: 4, c: 1, d: 4 }], ['Combine the middle terms.', 'x^2 + 8x + 16']] }],
        watch: '`(x + 4)^2` is NOT `x^2 + 16`. Write it out twice and FOIL. The middle term `8x` is the one people forget.' },
      { t: 'Factor a trinomial (FOIL backward)', rule: 'Pull out the GCF first. Then find two numbers that <b>multiply</b> to the last number and <b>add</b> to the middle number. They go in the parentheses.',
        ex: [{ q: 'Factor `x^2 + 2x - 15`.', steps: [['Find two numbers that multiply to −15 and add to 2. The product is negative, so one number is negative.', null], ['3 and −5 multiply to −15 but add to −2. Flip the signs: −3 and 5.', '(-3)(5) = -15'], ['They add to 2 ✓', '-3 + 5 = 2'], ['Put them in the parentheses.', 'x^2 + 2x - 15 = (x - 3)(x + 5)'], ['Check with FOIL.', { t: 'foil', a: 1, b: -3, c: 1, d: 5 }]] },
          { q: 'Factor `4x^2 + 8x - 60`.', steps: [['Every term shares a 4. Pull it out first.', '4x^2 + 8x - 60 = 4(x^2 + 2x - 15)'], ['Factor what’s left, just like the example above.', '4(x^2 + 2x - 15) = 4(x - 3)(x + 5)']] },
          { q: 'Which of these is a factor of `n^2 - 40n + 400`?', steps: [['Two numbers that multiply to 400 and add to −40. Both must be negative.', '(-20)(-20) = 400'], ['So it factors as', 'n^2 - 40n + 400 = (n - 20)(n - 20)'], ['`n - 20` is a factor.', null]] }],
        watch: 'Signs: if the last number is positive, both numbers have the same sign (the sign of the middle). If it’s negative, the signs are different. FOIL your answer back to check.' },
      { t: 'Solve by factoring: set each factor = 0', rule: 'To solve an equation with `x^2`, get 0 on one side, factor, then set <b>each</b> factor equal to 0. A product can only be 0 if one of its factors is 0. Most of these have two answers.',
        ex: [{ q: 'Solve `x^2 + 2x - 15 = 0`.', steps: [['Factor it, just like the example above.', 'x^2 + 2x - 15 = (x - 3)(x + 5)'], ['Now the equation says `(x - 3)(x + 5) = 0`. Set each factor equal to 0.', null], ['First factor: add 3 to both sides.', { t: 'bal', L: [[1, 'x'], [-3, '']], R: [[0, '']], op: [3, ''] }], ['Second factor: subtract 5 from both sides.', { t: 'bal', L: [[1, 'x'], [5, '']], R: [[0, '']], op: [-5, ''] }], ['The solutions are x = 3 and x = −5. Each one has the opposite sign of the number in its factor. Check x = −5:', '(-5)^2 + 2(-5) - 15 = 25 - 10 - 15 = 0']] },
          { q: 'Solve `x^2 + x = 12`.', steps: [['It doesn’t equal 0 yet. Subtract 12 from both sides first.', { t: 'bal', L: [[1, 'x^2'], [1, 'x']], R: [[12, '']], op: [-12, ''] }], ['Two numbers that multiply to −12 and add to 1: 4 and −3.', 'x^2 + x - 12 = (x + 4)(x - 3)'], ['Set each factor equal to 0: `x + 4 = 0` gives x = −4, and `x - 3 = 0` gives x = 3.', null], ['Check x = 3 in the original:', '(3)^2 + 3 = 12']] },
          { q: 'Solve `x^2 - 6x = 0`.', steps: [['Both terms have an x. Factor it out.', 'x^2 - 6x = x(x - 6)'], ['Set each factor equal to 0: the first factor gives x = 0, and `x - 6 = 0` gives x = 6.', { t: 'bal', L: [[1, 'x'], [-6, '']], R: [[0, '']], op: [6, ''] }], ['Don’t divide both sides by x. You would lose the answer x = 0.', null]] }],
        watch: '`(x - 3)(x + 5) = 0` gives x = 3 and x = −5, not −3 and 5. And if the equation equals 12 instead of 0, move the 12 first: setting factors equal to 12 doesn’t work.' },
      { t: 'Equivalent or NOT? Plug in a number', rule: 'Plug the same number (like x = 2, never 0 or 1) into the original and into every choice. Choices that give the same value are equivalent. The one that doesn’t match is NOT.',
        ex: [{ q: 'Which is NOT equivalent to `(2x + 10)(x - 5)`? A `2(x^2 - 25)` · B `2x^2 - 50` · C `2(x^2 - 10x + 25)` · D `2x(x - 5) + 10(x - 5)`', steps: [['Plug x = 2 into the original.', '(2(2) + 10)(2 - 5) = (14)(-3) = -42'], ['Choice A:', '2(2^2 - 25) = 2(-21) = -42'], ['Choice B:', '2(2)^2 - 50 = 8 - 50 = -42'], ['Choice C:', '2(2^2 - 10(2) + 25) = 2(9) = 18'], ['Choice D:', '2(2)(2 - 5) + 10(2 - 5) = -12 - 30 = -42'], ['Only C gives a different value, so C is NOT equivalent.', null]] }],
        watch: 'Don’t plug in 0 or 1. Too many wrong choices match by luck at those numbers.' }],
    tip: 'When the choices have x in them, plug in x = 2. It turns algebra into arithmetic, and it works for “equivalent,” “NOT equivalent,” FOIL and factoring questions.' },

  { n: 3, title: 'Percents, Ratios & Rates', short: 'Percents', cat: 'num', skills: ['s3a', 's3b', 's3c', 's3d'],
    why: 'Quantitative reasoning is 6 of the 20 questions, and percents, ratios and rates are the biggest part of it. These are some of the easiest points to lock in.',
    moves: [
      { t: 'The butterfly method', rule: 'A proportion is two equal fractions. Set them up with the same units on top and the same units on the bottom. Multiply along each wing of the butterfly (the two diagonals), set the two products equal, then divide.',
        ex: [{ q: 'A recipe uses 3 cups of flour for 4 dozen cookies. How much flour for 10 dozen?', steps: [['Cups on top, dozens on the bottom. Multiply along each wing.', { t: 'bf', a: '3', b: '4', c: 'x', d: '10' }], ['Divide both sides by 4. You need 7.5 cups.', { t: 'bal', L: [[4, 'x']], R: [[30, '']], div: 4, dec: true }]] },
          { q: 'If there are 1.6 kilometers in 1 mile, how many kilometers are in m miles?', steps: [['Same setup with a letter: kilometers on top, miles on the bottom. Call the unknown k.', { t: 'bf', a: '1.6', b: '1', c: 'k', d: 'm', noProd: true }], ['Multiply along the wings: `1.6 * m` and `1 * k`.', 'k = 1.6m'], ['Check: 2 miles should be 3.2 km, and `1.6(2) = 3.2` ✓', null]] },
          { q: 'The ratio of boys to girls is 3:5. There are 40 students. How many are girls?', steps: [['3 + 5 = 8 equal shares. Find one share.', '40 ÷ 8 = 5'], ['Girls get 5 shares.', '5 * 5 = 25']] },
          { q: 'Sofia and Valeria paid $64 together. Valeria paid `{3/5}` of what Sofia paid. How much did Valeria pay?', steps: [['Think in parts: Sofia pays 5 parts, and Valeria pays 3 of those parts.', null], ['8 parts cost $64. Find one part.', '64 ÷ 8 = 8'], ['Valeria paid 3 parts.', '3 * 8 = 24'], ['Check: `{3/5}` of 40 is 24, and 40 + 24 = 64 ✓', null]] }],
        watch: 'Each wing gives one product. Never multiply straight across the tops. And a ratio like 3:5 compares the parts to each other, so add the parts to get the total number of shares.' },
      { t: 'Percents: multiply, or use the butterfly', tpl: true, rule: 'To find a percent <b>of</b> a number, change the percent to a decimal and multiply the old-school way: line up the right edges, multiply like whole numbers, and count the decimal places. When the percent or the whole is the unknown, set up <b>is over of equals percent over 100</b> and use the butterfly method.',
        ex: [{ q: 'What is 35% of 140?', steps: [['Change the percent to a decimal: 35% = .35.', null], ['Multiply 140 × .35. Line up the right edges and multiply like whole numbers. The small numbers above 140 are the carries.', { t: 'vmul', a: 140, b: 0.35 }], ['49.00 is the same as 49.', null]] },
          { q: '18 is what percent of 72?', steps: [['Set up “is over of equals percent over 100.” The part (is) is 18, the whole (of) is 72, and the percent is unknown.', { t: 'bf', a: '18', b: '72', c: 'x', d: '100', lab: true, noProd: true }], ['Make it easier: simplify `{18/72}` by dividing the top and bottom by 18.', '{18/72} = {1/4}'], ['Now use the butterfly method: multiply along each wing.', { t: 'bf', a: '1', b: '4', c: 'x', d: '100' }], ['Divide both sides by 4. The answer is 25%.', { t: 'bal', L: [[4, 'x']], R: [[100, '']], div: 4 }]] },
          { q: '15 is 30% of what number?', steps: [['Set up “is over of equals percent over 100.” The part (is) is 15, the whole (of) is unknown, and the percent is 30.', { t: 'bf', a: '15', b: 'x', c: '30', d: '100', lab: true, noProd: true }], ['Make it easier: simplify `{30/100}` by dividing the top and bottom by 10.', '{30/100} = {3/10}'], ['Now use the butterfly method: multiply along each wing.', { t: 'bf', a: '15', b: 'x', c: '3', d: '10' }], ['Divide both sides by 3. The number is 50.', { t: 'bal', L: [[3, 'x']], R: [[150, '']], div: 3 }]] }],
        watch: 'When you multiply, line up the right edges, not the decimal points. In the butterfly setup, the “of” number always goes on the bottom: in “18 is what percent of 72,” the 72 goes under the 18.' },
      { t: 'Discounts, tax, and markups', rule: 'Turn the story into one multiplication. For 25% off, you still pay 75%, so multiply by .75. For 8.25% tax, you pay 108.25%, so multiply by 1.0825. For a 35% increase, multiply by 1.35. To find a percent change or an original price, use the butterfly setup instead.',
        ex: [{ q: 'A $60 jacket is 25% off. What is the sale price?', steps: [['25% off means you still pay 100% − 25% = 75%. As a decimal, that is .75.', null], ['Multiply 60 × .75 the old-school way.', { t: 'vmul', a: 60, b: 0.75 }], ['The sale price is $45.', null]] },
          { q: 'Dallas sales tax is 8.25%. What do you pay for a $40 item?', steps: [['With tax you pay 100% + 8.25% = 108.25%. As a decimal, that is 1.0825.', null], ['Multiply 40 × 1.0825. Put 40 on the bottom since it has fewer digits. Multiplying by its 0 gives a row of zeros.', { t: 'vmul', a: 40, b: 1.0825 }], ['Money only needs two decimal places: 43.3000 is $43.30.', null]] },
          { q: 'A $140 price goes up 35%. What is the new price?', steps: [['Going up 35% means the new price is 100% + 35% = 135%. As a decimal, that is 1.35.', null], ['Multiply 140 × 1.35 the old-school way.', { t: 'vmul', a: 140, b: 1.35 }], ['The new price is $189.', null]] },
          { q: 'A price goes from $40 to $50. What is the percent increase?', steps: [['Find the change.', '50 - 40 = 10'], ['Set up “is over of equals percent over 100.” The change (is) is 10, the original price (of) is 40, and the percent is unknown.', { t: 'bf', a: '10', b: '40', c: 'x', d: '100', lab: true, noProd: true }], ['Make it easier: simplify `{10/40}` by dividing the top and bottom by 10.', '{10/40} = {1/4}'], ['Now use the butterfly method: multiply along each wing.', { t: 'bf', a: '1', b: '4', c: 'x', d: '100' }], ['Divide both sides by 4. That is a 25% increase.', { t: 'bal', L: [[4, 'x']], R: [[100, '']], div: 4 }]] },
          { q: 'After 20% off, a shirt costs $32. What was the original price?', steps: [['You paid 100% − 20% = 80% of the original price, and that was $32.', null], ['Set up “is over of equals percent over 100.” What you paid (is) is 32, the original price (of) is unknown, and the percent is 80.', { t: 'bf', a: '32', b: 'x', c: '80', d: '100', lab: true, noProd: true }], ['Make it easier: simplify `{80/100}` by dividing the top and bottom by 20.', '{80/100} = {4/5}'], ['Now use the butterfly method: multiply along each wing.', { t: 'bf', a: '32', b: 'x', c: '4', d: '5' }], ['Divide both sides by 4. The original price was $40.', { t: 'bal', L: [[4, 'x']], R: [[160, '']], div: 4 }]] }],
        watch: 'For a discount, multiply by what you <b>pay</b>, not by what you save. 25% off is × .75, not × .25. And to undo a discount, don’t add 20% of $32 back on: that gives $38.40, which is wrong.' },
      { t: 'Graphs: read the labels first', rule: 'Before any math, read the axis and the labels. “In hundreds” means multiply by 100. On a circle graph, each slice is a percent of the whole, so the gap between two slices is a percent of the whole too.',
        ex: [{ q: 'The bar graph shows museum visitors. On Friday, visitors were a one-fifth increase from Thursday. How many visitors came on Friday?', fig: { kind: 'bar', labels: ['Mon', 'Tue', 'Wed', 'Thu'], vals: [2, 3.5, 2.5, 5], ylab: 'Visitors (in hundreds)', title: 'Museum visitors' },
          steps: [['Read Thursday’s bar: 5. The axis says “in hundreds,” so that’s 500.', '5 * 100 = 500'], ['A one-fifth increase means 1 + `{1/5}` of Thursday. As a decimal that is 1.2.', null], ['Multiply 500 × 1.2 the old-school way.', { t: 'vmul', a: 500, b: 1.2 }], ['600 visitors came on Friday.', null]] },
          { q: 'The circle graph shows how four friends split a bill. Maya paid $8 more than Eli. How much did Tess pay?', fig: { kind: 'pie', labels: ['Maya', 'Eli', 'Tess', 'Raj'], vals: [40, 30, 20, 10], title: 'Share of the bill' },
          steps: [['Maya’s slice is 40% and Eli’s is 30%. The $8 gap is 40% − 30% = 10% of the whole bill.', null], ['Set up “is over of equals percent over 100.” The gap (is) is 8, the whole bill (of) is unknown, and the percent is 10.', { t: 'bf', a: '8', b: 'x', c: '10', d: '100', lab: true, noProd: true }], ['Simplify `{10/100}` to `{1/10}`, then multiply along each wing.', { t: 'bf', a: '8', b: 'x', c: '1', d: '10' }], ['The whole bill was $80. Tess paid 20% of it.', '80 * 0.2 = 16'], ['Tess paid $16.', null]] }],
        watch: 'If you skip “in hundreds,” you get 6 instead of 600. And on a circle graph, the $8 is the <b>gap</b> (10%), not anybody’s share.' },
      { t: 'Rates, time and mixtures', rule: 'A unit rate is the amount for one. Time = total ÷ rate: move the decimal point in both numbers so you divide by a whole number. For “the greatest number you can make,” divide and round DOWN.',
        ex: [{ q: 'A pump moves 2.5 gallons per minute. How long will it take to move 75 gallons?', steps: [['Time = total ÷ rate.', '{75/2.5}'], ['Move the decimal point one place right in both numbers so you divide by a whole number.', '{75/2.5} = {750/25}'], ['Divide the old-school way.', { t: 'ldiv', n: 750, d: 25 }], ['Check: rate × time = total.', '2.5 * 30 = 75 ✓']] },
          { q: 'Marcus has $45. Shirts cost $6 each. What is the greatest number of shirts he can buy?', steps: [['Divide the old-school way.', { t: 'ldiv', n: 45, d: 6 }], ['He can’t buy 7.5 shirts. Round DOWN: part of a shirt doesn’t count. The answer is 7.', null], ['Check: 7 shirts cost $42, which fits in $45. An 8th shirt would make it $48.', '7 * 6 = 42']] },
          { q: 'Mix 4 liters of 10% salt water with 6 liters of 20% salt water. What percent salt is the mix?', steps: [['Salt in the first part is 10% of 4 liters: move the decimal point one place left.', '4 ÷ 10 = 0.4'], ['Salt in the second part is 20% of 6 liters. 10% of 6 is 0.6, so 20% is twice that.', '2 * 0.6 = 1.2'], ['Total salt ÷ total liters.', '1.6 ÷ 10 = 0.16 = 16%']] }],
        watch: 'Time = total ÷ rate, not total × rate. Ask yourself: should it take more or less time than the number you started with? And you can’t just average 10% and 20% to get 15% unless the amounts are equal.' }],
    tip: 'Estimate first. 25% off $60 has to be less than $60 and more than $30, which rules out choices before you work anything out.' },

  { n: 4, title: 'Word Problems into Equations', short: 'Word problems', cat: 'num', skills: ['s2a', 's2b', 's2c', 's2d'],
    why: 'The TSI hides algebra inside stories about phone plans, tickets and road trips. Turn the words into an equation, or try the answer choices, and you already know how to finish.',
    moves: [
      { t: 'Translate piece by piece', rule: 'Read the sentence in chunks and turn each chunk into math.', words: true,
        ex: [{ q: 'Write and solve: “5 less than twice a number is 17.”', steps: [['“Twice a number” is `2n`.', '2n'], ['“5 less than” that takes 5 away from it.', '2n - 5'], ['“Is 17” finishes the equation.', '2n - 5 = 17'], ['Add 5 to both sides.', { t: 'bal', L: [[2, 'n'], [-5, '']], R: [[17, '']], op: [5, ''] }], ['Divide both sides by 2.', { t: 'bal', L: [[2, 'n']], R: [[22, '']], div: 2 }]] }],
        watch: '“Less than” flips the order. “5 less than x” is `x - 5`, not `5 - x`.' },
      { t: 'Start + rate × count', rule: 'Most TSI story equations have a one-time amount and an amount that repeats. The repeating amount gets multiplied by the variable.',
        ex: [{ q: 'A gym charges a $30 sign-up fee plus $20 per month. Write the total cost C after m months.', steps: [['The one-time $30 stands alone.', '30'], ['The $20 repeats every month, so multiply it by m.', '20m'], ['Put them together.', 'C = 20m + 30'], ['Test it: 2 months should cost $30 + $40 = $70.', 'C = 20(2) + 30 = 70 ✓']] }],
        watch: 'Don’t multiply the one-time fee by the variable. `C = 20(m + 30)` would charge the fee every month.' },
      { t: 'Answer the question asked', rule: 'Write the equation, solve it, then reread the question. Wrong choices are often the right number for a different question.',
        ex: [{ q: 'Same gym. You have paid $190 in total. How many months?', steps: [['Set the cost equal to 190.', '20m + 30 = 190'], ['Subtract the $30 fee from both sides.', { t: 'bal', L: [[20, 'm'], [30, '']], R: [[190, '']], op: [-30, ''] }], ['Divide both sides by 20.', { t: 'bal', L: [[20, 'm']], R: [[160, '']], div: 20 }]] },
          { q: 'Gym A costs $30 plus $20 per month. Gym B costs $70 plus $15 per month. When do they cost the same?', steps: [['Set the two totals equal.', '20m + 30 = 15m + 70'], ['Subtract `15m` from both sides.', { t: 'bal', L: [[20, 'm'], [30, '']], R: [[15, 'm'], [70, '']], op: [-15, 'm'] }], ['Subtract 30 from both sides.', { t: 'bal', L: [[5, 'm'], [30, '']], R: [[70, '']], op: [-30, ''] }], ['Divide both sides by 5.', { t: 'bal', L: [[5, 'm']], R: [[40, '']], div: 5 }], ['Check: Gym A costs $190, and Gym B costs $70 + $120 = $190 ✓', null]] }],
        watch: 'If the choices include both 160 and 8, ask yourself whether the question wants dollars or months.' },
      { t: 'Two items, one total: try the choices', rule: 'When a group buys two kinds of things and you know the total, don’t set up a system. Try each answer choice: whatever is left over is the other item. Check the total.',
        ex: [{ q: '10 friends each ordered one hot dog ($2.50) or one burger ($4). The total was $34. How many burgers? (Choices: 4, 5, 6, 7)', steps: [['Try 5 burgers. Then 10 − 5 = 5 are hot dogs.', '5 * 4 + 5 * 2.50 = 20 + 12.50 = 32.50'], ['$32.50 is too low. Burgers cost more, so try more burgers: 6 burgers and 4 hot dogs.', '6 * 4 + 4 * 2.50 = 24 + 10 = 34 ✓'], ['6 burgers.', null]] }],
        watch: 'The choice that gives the number of hot dogs (4) is a trap. Check which item the question asks about.' },
      { t: 'Distance = rate × time', rule: 'Use `d = rt`. When two things move at the same time, combine their speeds. For an answer in minutes, remember that miles per hour means miles in 60 minutes.',
        ex: [{ q: 'Two cars start 280 miles apart and drive toward each other at 60 mph and 80 mph. How long until they meet?', steps: [['Toward each other, the gap shrinks by 60 + 80 = 140 miles every hour.', '140t = 280'], ['Divide by 140. They meet after 2 hours.', 't = 2']] },
          { q: 'Biking at 12 miles per hour, how many minutes does it take to bike 3 miles?', steps: [['12 miles per hour means 12 miles in 60 minutes. Miles on top, minutes on the bottom. Use the butterfly method.', { t: 'bf', a: '12', b: '60', c: '3', d: 'x' }], ['Divide both sides by 12. It takes 15 minutes.', { t: 'bal', L: [[12, 'x']], R: [[180, '']], div: 12 }]] }],
        watch: 'Toward each other or in opposite directions: add the speeds. One catching up to the other: subtract them. And if the question says minutes, an answer like 0.25 is in hours.' }],
    tip: 'Underline the question before you start. When you finish, check that your answer is in the units it asked for.' },

  { n: 5, title: 'Data & Probability', short: 'Data', cat: 'data', skills: ['dp1', 'dp2', 'dp3', 'dp4'],
    why: 'Four of the 20 questions are data and probability, and they take less algebra than anything else on the test. Count carefully and read “more than,” “fewer than” and “at least” exactly.',
    moves: [
      { t: 'Dot plots: each dot is one', rule: 'Each dot is one person. “More than 2” and “fewer than 2” do <b>not</b> count the 2s. A fraction is the count you want over the total number of dots.',
        ex: [{ q: 'The dot plot shows pets for 20 students. What fraction have more than 2 pets?', fig: { kind: 'dot', vals: [0, 1, 2, 3, 4], counts: [2, 6, 5, 4, 3], label: 'Number of pets' },
          steps: [['“More than 2” means the 3 and 4 columns only.', '4 + 3 = 7'], ['Count all the dots.', '2 + 6 + 5 + 4 + 3 = 20'], ['Count over total.', '{7/20}']] },
          { q: 'Same dot plot. What fraction have fewer than 2 pets?', steps: [['“Fewer than 2” means the 0 and 1 columns only.', '2 + 6 = 8'], ['Count over total, then simplify.', '{8/20} = {2/5}']] }],
        watch: 'The most common wrong answer counts the 2s. “More than 2” and “fewer than 2” both leave the 2 column out. “At least 2” keeps it.' },
      { t: 'Averages of two groups', rule: 'Count × average = total. Add the totals, then divide by everyone. The answer leans toward the bigger group.',
        ex: [{ q: '6 players averaged 10 points and 4 players averaged 20 points. What is the average for all 10 players?', steps: [['Total for each group: count × average.', '6 * 10 = 60'], ['The second group.', '4 * 20 = 80'], ['Add the totals, then divide by all 10 players.', '{60 + 80/10} = {140/10} = 14']] },
          { q: 'Your scores are 78, 85 and 90. What do you need on the 4th test to average 85?', steps: [['An 85 average on 4 tests means a total of', '85 * 4 = 340'], ['Add what you already have.', '78 + 85 + 90 = 253'], ['Subtract to find what you need.', '340 - 253 = 87']] }],
        watch: 'Don’t just average the two averages (15). That only works when the groups are the same size. Here there are more players at 10, so it leans toward 10.' },
      { t: 'Probability: want ÷ total', rule: 'Probability = what you want ÷ the total. For “NOT green,” count everything else. For two picks without putting back, multiply, and on the second pick the bottom drops by 1.',
        ex: [{ q: 'A bag has 5 red, 3 blue and 12 green marbles. One is picked at random. What is the probability it is NOT green?', steps: [['NOT green means red or blue.', '5 + 3 = 8'], ['Total marbles.', '5 + 3 + 12 = 20'], ['Want over total, then simplify.', '{8/20} = {2/5}']] },
          { q: 'A bag has 3 red and 2 blue marbles. Two are pulled out without putting the first back. What is the probability both are red?', steps: [['First pick: 3 red out of 5.', '{3/5}'], ['Second pick: one red is gone. 2 red out of 4.', '{2/4}'], ['Multiply, then simplify.', '{3/5} * {2/4} = {6/20} = {3/10}']] }],
        watch: 'Without putting it back, the bottom drops by 1 on the second pick. When you want the same color again, the top drops by 1 too.' },
      { t: '“At least” means 1 minus the bad case', rule: 'Find the chance of the only bad case. Subtract it from 1.',
        ex: [{ q: 'Jess has three $10 bills and five $20 bills. She pulls out two at random. What is the probability they add up to at least $30?', steps: [['Two $10 bills make $20, the only pair under $30. Every other pair works.', null], ['Chance of two $10 bills (no putting back).', '{3/8} * {2/7} = {6/56} = {3/28}'], ['Subtract from 1.', '1 - {3/28} = {25/28}']] }],
        watch: 'Don’t try to add up every good case. There are usually more of them. Find the one bad case and subtract it from 1.' }],
    tip: 'Underline the exact words: more than, fewer than, at least, NOT. Most wrong answers on these questions come from counting one column too many or too few.' },

  { n: 6, title: 'Lines & Functions', short: 'Functions', cat: 'alg', skills: ['s4a', 's4b', 's4c', 's4d'],
    why: 'Questions about the xy-plane: plug into f(x), find a slope or a y-intercept, check whether a point is on a line, and predict how a graph moves.',
    moves: [
      { t: 'f(x) means “plug in”', rule: 'To find f(−2), replace every x with (−2), in parentheses. Then follow the order of operations.',
        ex: [{ q: 'If `f(x) = 3x^2 - 2x + 1`, find `f(-2)`.', steps: [['Replace every x with (−2).', 'f(-2) = 3(-2)^2 - 2(-2) + 1'], ['Square first: `(-2)^2 = 4`.', '= 3(4) - 2(-2) + 1'], ['Multiply, then add.', '= 12 + 4 + 1 = 17']] },
          { q: 'Price `p(n) = 50 - n`, cost `C(n) = 300 + 10n`, and revenue `R(n) = n * p(n)`. For what n are revenue and cost equal? (Choices: 5, 10, 15, 20)', steps: [['Revenue is n times the price: `R(n) = n(50 - n)`. Try the choices.', null], ['Try n = 15: revenue and cost don’t match.', '15(50 - 15) = 525'], ['Cost at 15 is 450. Not equal. Try n = 10.', '10(50 - 10) = 400'], ['Cost at 10:', '300 + 10(10) = 400 ✓'], ['They match, so n = 10.', null]] }],
        watch: '`(-2)^2` is 4, not −4. Use parentheses every time you plug in a negative number.' },
      { t: 'Slope and intercept', rule: 'In `y = mx + b`, m is the slope (rise over run) and b is where the line crosses the y-axis. To find the y-intercept of any equation, put 0 in for x and solve for y. In a story, m is the rate and b is the starting amount.',
        ex: [{ q: 'Find the slope of the line through `(1, 3)` and `(4, 12)`.', steps: [['Rise over run: change in y over change in x.', 'm = {12 - 3/4 - 1} = {9/3} = 3']] },
          { q: 'What is the y-intercept of `2y = 5x - (x + 6)`?', steps: [['Put 0 in for every x.', '2y = 5(0) - (0 + 6)'], ['Simplify the right side.', '2y = -6'], ['Divide by 2.', 'y = -3']] },
          { q: 'What is the y-intercept of `y = 2(x + 3)(x - 4)`?', steps: [['Put 0 in for x.', 'y = 2(0 + 3)(0 - 4)'], ['Multiply.', 'y = 2(3)(-4) = -24']] },
          { q: 'The slope of `y = mx + 1` is less than the slope of `y = -2x + 5`. What must be true about m?', steps: [['The slope of `y = -2x + 5` is the number in front of x: −2.', null], ['A smaller slope means a smaller m.', 'm < -2']] },
          { q: 'A tutor uses `C = 15h + 40` to find the cost of h hours. What do 15 and 40 mean?', steps: [['15 is multiplied by h, so it is the rate: $15 for each hour.', null], ['40 stands alone, so it is the starting amount: a $40 fee before any hours.', null]] }],
        watch: 'Rise goes on top. And for the y-intercept, stopping at `2y = -6` is a trap: divide by 2.' },
      { t: 'Is the point on the line? Plug it in', rule: 'A point is on a line if it makes the equation true. The first number is x and the second is y. Try each choice.',
        ex: [{ q: 'Which point is on the graph of `4x + 2y = 18`? (2, 4), (3, 4), (1, 7) or (4, 2)?', steps: [['(2, 4):', '4(2) + 2(4) = 8 + 8 = 16'], ['(3, 4):', '4(3) + 2(4) = 12 + 8 = 20'], ['(1, 7):', '4(1) + 2(7) = 4 + 14 = 18 ✓'], ['(4, 2):', '4(4) + 2(2) = 16 + 4 = 20'], ['Only `(1, 7)` makes it 18, so it is on the line.', null]] }],
        watch: 'Keep the order: (x, y). Plugging 7 in for x and 1 in for y is the classic mistake.' },
      { t: 'Shifts move the graph', rule: 'A number outside the parentheses moves the graph up or down. A number inside moves it left or right, opposite its sign.', fig: 'shift', rules: true,
        ex: [{ q: 'What is the vertex of `y = (x - 4)^2 + 1`?', steps: [['Inside: `x - 4` means right 4.', 'h = 4'], ['Outside: `+ 1` means up 1.', 'k = 1'], ['The vertex is the point (h, k).', '(4, 1)']] }],
        watch: '`f(x - 3)` moves the graph <b>right</b> 3, not left. Inside the parentheses works backward.' },
      { t: 'Match a graph or a table', rule: 'Find b first: the y-value when x = 0. Then find the slope: how much y changes when x goes up by 1.',
        ex: [{ q: 'Which equation fits this table?', tbl: { xs: [1, 2, 3, 4], ys: [5, 8, 11, 14] }, steps: [['y goes up 3 each time x goes up 1.', 'm = 3'], ['Step back from x = 1 to x = 0: 5 − 3 = 2.', 'b = 2'], ['Put it together.', 'y = 3x + 2'], ['Check a row: x = 3 gives `3(3) + 2 = 11` ✓', null]] }],
        watch: '5 is the output when x = 1, so it is not the y-intercept. The intercept is the output when x = 0.' }],
    tip: 'Check one point. Pick a point you can read exactly from the graph or table, plug it into each choice, and the wrong ones fail fast.' },

  { n: 7, title: 'Exponents, Roots & Growth', short: 'Exponents', cat: 'alg', skills: ['xp1', 'xp2', 'xp3', 'xp4', 'xp5'],
    why: 'Usually one or two questions. Learn a few short rules, and you can check any answer by plugging in small numbers. Percent growth shows up in money and population questions too.',
    moves: [
      { t: 'Exponent rules', rule: 'Anything to the 0 power is 1. Multiplying: add the exponents. Dividing: subtract them. A power of a power: multiply them.',
        ex: [{ q: 'Simplify `x^2 * x^5`, `{x^6/x^2}` and `(x^3)^2`.', steps: [['Multiplying: add.', 'x^2 * x^5 = x^{2 + 5} = x^7'], ['Dividing: subtract.', '{x^6/x^2} = x^{6 - 2} = x^4'], ['Power of a power: multiply.', '(x^3)^2 = x^{3 * 2} = x^6']] },
          { q: 'Simplify `x^-2 * x^6 * y^0`.', steps: [['Add the x exponents, and `y^0 = 1`.', 'x^-2 * x^6 * y^0 = x^{-2 + 6} * 1'], ['Simplify.', 'x^4']] }],
        watch: '`x^2 * x^5` is `x^7`, not `x^10`. Multiplying the bases means <b>adding</b> the exponents.' },
      { t: 'Negative exponents', rule: 'A negative exponent moves the factor across the fraction bar: `x^-3 = {1/x^3}`. It does NOT make the number negative. A power of −1 flips every exponent’s sign.',
        ex: [{ q: 'What is `2^-3`?', steps: [['Move it across the fraction bar and make the exponent positive.', '2^-3 = {1/2^3} = {1/8}']] },
          { q: 'Simplify `({x^-2y^3/y^5})^-1`.', steps: [['Inside first. Dividing: subtract the y exponents.', '{y^3/y^5} = y^{3 - 5} = y^-2'], ['So the inside is', 'x^-2y^-2'], ['The power of −1 flips the sign of every exponent.', '(x^-2y^-2)^-1 = x^2y^2'], ['Check with x = 2 and y = 3: the original and `x^2y^2` both give 36.', null]] }],
        watch: '`2^-3` is `{1/8}`, not −8 and not −6.' },
      { t: 'Square roots: real or not', rule: 'The number under a square root can’t be negative. Plug each choice into what’s under the root. If it comes out negative, the function is NOT a real number there.',
        ex: [{ q: 'For which x is `f(x) = √{16 - x^2}` NOT a real number: −4, 0, 4 or 5?', steps: [['x = −4. The negative gets squared, so it’s fine.', '16 - (-4)^2 = 16 - 16 = 0'], ['x = 0:', '16 - 0^2 = 16'], ['x = 4:', '16 - 4^2 = 16 - 16 = 0'], ['x = 5: negative under the root, so it’s NOT a real number.', '16 - 5^2 = 16 - 25 = -9']] }],
        watch: 'A negative x is not the problem: `(-4)^2` is +16. And 0 under the root is fine. Only a negative number under the root fails.' },
      { t: 'Doubling and halving', rule: 'Doubles every k years: start × `2^{t/k}`. Halves every k: start × `0.5^{t/k}`. Always check two times: t = 0 should give the start, and t = k should give double (or half).',
        ex: [{ q: 'A town has 300 bikes to share, and the number doubles every 5 years. Which expression gives the number after t years?', steps: [['Start × 2 to the (t over 5).', '300 * 2^{t/5}'], ['Check t = 0: you should get the start.', '300 * 2^0 = 300'], ['Check t = 5: you should get double.', '300 * 2^1 = 600']] },
          { q: 'A 400 mg dose halves every 6 hours. Write the amount after t hours.', steps: [['Start × 0.5 to the (t over 6).', '400 * 0.5^{t/6}'], ['Check t = 6: half of 400.', '400 * 0.5^1 = 200']] }],
        watch: '`300 * 2^{5t}` passes the t = 0 check but fails at t = 5. Always do both checks.' },
      { t: 'Percent growth and decay', rule: 'Growing r% each year: you have 100% + r% after each year, so multiply by that as a decimal. 4% growth is × 1.04. Losing r% each year: you keep 100% − r%. 15% decay is × 0.85. After t years: start × factor to the t power.',
        ex: [{ q: 'A $500 deposit earns 4% interest each year. Which expression gives its value after t years?', steps: [['Each year you keep 100% and add 4%: 104%, or 1.04.', '1 + 0.04 = 1.04'], ['Multiply by 1.04 once for every year, so t is the exponent.', '500(1.04)^t'], ['Check t = 1: one year of 4% interest on $500 is $20.', '500(1.04)^1 = 520']] },
          { q: 'A $20,000 car loses 15% of its value each year. What is it worth after 2 years?', steps: [['It keeps 100% − 15% = 85% each year, so multiply by .85 each year.', null], ['Year 1: multiply 20000 × .85 the old-school way.', { t: 'vmul', a: 20000, b: 0.85 }], ['Year 2: multiply 17000 × .85.', { t: 'vmul', a: 17000, b: 0.85 }], ['It’s worth $14,450. Not $14,000: the second year’s 15% comes off the smaller value.', null]] },
          { q: 'A phone’s value is `V = 800(0.75)^t`. By what percent does it lose value each year?', steps: [['The factor 0.75 means it keeps 75% each year.', null], ['It loses the rest.', '100 - 75 = 25'], ['It loses 25% each year. (Not 75%: that’s what it keeps.)', null]] }],
        watch: 'A growth factor is more than 1 and a decay factor is less than 1. 6% growth is 1.06, not 0.06 and not 1.6. 12% decay is 0.88, not 0.12.' }],
    tip: 'Plug in small numbers. Pick x = 2 (and y = 3), work out the original, then work out each choice. The one that matches is right.' },

  { n: 8, title: 'Geometry & Trig', short: 'Geometry', cat: 'geo', skills: ['ge1', 'ge2', 'ge3', 'ge4'],
    why: 'Three of the 20 questions. Know area and volume (the formula is often given), square the whole radius, and stand at the angle for SOH CAH TOA.',
    moves: [
      { t: 'Area with x in it: try the choices', rule: 'Triangle: A = ½ × base × height. Rectangle: A = length × width. When x is in the sides, plug in the answer choices instead of solving.',
        ex: [{ q: 'A triangle has base `x + 4`, height x, and area 16. What is x? (Choices: 2, 3, 4, 6)', fig: { kind: 'triArea', base: 'x + 4', h: 'x' },
          steps: [['Try x = 3: too small.', '{1/2} * 7 * 3 = 10.5'], ['Try x = 4:', '{1/2} * 8 * 4 = 16 ✓'], ['x = 4.', null]] }],
        watch: 'The height is the straight-up distance (the dashed line), not a slanted side.' },
      { t: 'Volume in terms of a letter', rule: 'Cylinder: V = πr²h. Box: V = length × width × height. Square the <b>whole</b> radius: `(2b)^2 = 4b^2`. Multiplying adds exponents: `b^2 * b = b^3`.',
        ex: [{ q: 'A cylinder has radius `r = 2b` and height `3b + 2`. Write its volume in terms of b.', fig: { kind: 'cyl' }, steps: [['Substitute into V = πr²h.', 'V = π(2b)^2(3b + 2)'], ['Square the whole radius: `(2b)^2 = 4b^2`.', '= 4πb^2(3b + 2)'], ['Distribute.', '= 12πb^3 + 8πb^2']] },
          { q: 'A cube has side g. A bigger box has sides g, `g + 2` and `g + 5`. How much more volume does the bigger box have?', steps: [['The cube’s volume is `g^3`. For the bigger box, FOIL the two parentheses first.', { t: 'foil', a: 1, b: 2, c: 1, d: 5, v: 'g' }], ['Multiply every term by the last g.', 'g(g^2 + 7g + 10) = g^3 + 7g^2 + 10g'], ['Subtract the cube’s volume.', 'g^3 + 7g^2 + 10g - g^3 = 7g^2 + 10g']] }],
        watch: '`(2b)^2` is `4b^2`, not `2b^2`. And π is not squared: only the radius is.' },
      { t: 'SOH CAH TOA', rule: 'Stand at the angle. Opposite is the side across from it, adjacent is the side touching it (not the hypotenuse), and the hypotenuse is across from the right angle. sin = opposite/hypotenuse, cos = adjacent/hypotenuse, tan = opposite/adjacent.',
        ex: [{ q: 'In right triangle ABC, angle C is the right angle, BC = 5, AC = 12 and AB = 13. Find sin A, cos A and tan A.', fig: { kind: 'rtri', a: 5, b: 12, c: 13 },
          steps: [['Stand at A. Opposite = BC = 5. Adjacent = AC = 12. Hypotenuse = AB = 13.', null], ['SOH: opposite over hypotenuse.', 'sin A = {5/13}'], ['CAH: adjacent over hypotenuse.', 'cos A = {12/13}'], ['TOA: opposite over adjacent.', 'tan A = {5/12}']] }],
        watch: 'Opposite and adjacent switch when you move to the other angle. Stand at the angle the question asks about.' },
      { t: 'The missing side, and cos B', rule: 'a² + b² = c², where c is the hypotenuse. When C is the right angle, the side next to B is the side across from A, so cos B = sin A.',
        ex: [{ q: 'A right triangle has legs 6 and 8. How long is the hypotenuse?', steps: [['a² + b² = c².', '6^2 + 8^2 = 36 + 64 = 100'], ['Take the square root.', '√{100} = 10']] },
          { q: 'In triangle ABC, angle C is a right angle and `cos A = {5/13}`. What is `cos B`?', fig: { kind: 'rtri', a: '?', b: 5, c: 13 }, steps: [['cos A = adjacent ÷ hypotenuse, so AC = 5 and AB = 13. Find the other leg.', '13^2 - 5^2 = 169 - 25 = 144'], ['Take the square root: BC = 12.', '√{144} = 12'], ['The side next to B is BC, across from A.', 'cos B = {12/13}']] }],
        watch: 'cos B is not the same as cos A. Find the missing side, then stand at B.' }],
    tip: 'Draw and label the figure if the question doesn’t give one. Most geometry mistakes come from putting a number on the wrong side.' }
];
const MOD_OF = {}; MODS.forEach(m => m.skills.forEach(s => { MOD_OF[s] = m; }));
/* ---------- end lessons ---------- */
const HABITS = [
  ['Try the answer choices', 'Every question is multiple choice. When x is in the problem, put each choice back in and see which one works. It is often faster than the algebra.'],
  ['Plug in a number', 'For “which expression is equivalent,” put x = 2 into the original and into each choice. The one that matches is the answer. Don’t use 0 or 1.'],
  ['Answer the question asked', 'Underline what it asks for. Wrong choices are often the right number for a different question, like x instead of 8x, or the fee instead of the total.'],
  ['Read the labels', '“In hundreds,” “more than,” “at least,” “NOT,” “minutes.” One word changes the answer, and the test is built around those words.'],
  ['Parentheses for negatives', 'When you plug in a negative number, wrap it in parentheses. `(-3)^2 = 9`, but `-3^2 = -9`.']
];
const WORDS = [['is, equals, gives', '='], ['more than, increased by, sum, plus', '+'], ['less than, decreased by, difference, minus', '−'], ['times, of, product, twice', '×'], ['per, divided by, quotient', '÷']];
const RULES = [['f(x) + k', 'up k'], ['f(x) - k', 'down k'], ['f(x - h)', 'right h'], ['f(x + h)', 'left h'], ['-f(x)', 'flips upside down']];

/* ---------- state ---------- */
const S = { view: 'home', tab: {}, prac: {}, ex: {}, mix: null, arm: false, shift: { h: 2, k: 1 } };
const app = document.getElementById('app');

/* ---------- small pieces ---------- */
function plot(o) {
  const xr = o.xr || [-6, 6], yr = o.yr || [-6, 6], u = 24, W = (xr[1] - xr[0]) * u, H = (yr[1] - yr[0]) * u;
  const sx = x => (x - xr[0]) * u, sy = y => (yr[1] - y) * u, id = 'clip' + Math.random().toString(36).slice(2, 8);
  let g = `<rect class="bg" x="0" y="0" width="${W}" height="${H}"/>`;
  for (let x = xr[0]; x <= xr[1]; x++) g += `<line class="gl${x === 0 ? ' ax' : ''}" x1="${sx(x)}" y1="0" x2="${sx(x)}" y2="${H}"/>`;
  for (let y = yr[0]; y <= yr[1]; y++) g += `<line class="gl${y === 0 ? ' ax' : ''}" x1="0" y1="${sy(y)}" x2="${W}" y2="${sy(y)}"/>`;
  let t = '';
  if (yr[0] <= 0 && yr[1] >= 0) for (let x = xr[0] + 1; x < xr[1]; x++) if (x && x % 2 === 0) t += `<text class="tk" x="${sx(x)}" y="${sy(0) + 15}" text-anchor="middle">${fmtN(x)}</text>`;
  if (xr[0] <= 0 && xr[1] >= 0) for (let y = yr[0] + 1; y < yr[1]; y++) if (y && y % 2 === 0) t += `<text class="tk" x="${sx(0) - 6}" y="${sy(y) + 4}" text-anchor="end">${fmtN(y)}</text>`;
  t += `<text class="axl" x="${W - 5}" y="${sy(0) - 7}" text-anchor="end">x</text><text class="axl" x="${sx(0) + 7}" y="14">y</text>`;
  let c = '';
  for (const cv of o.curves || []) {
    let d = '', pen = false; const step = (xr[1] - xr[0]) / 300;
    for (let x = xr[0] - step; x <= xr[1] + step; x += step) { const y = cv.f(x); if (!isFinite(y) || y < yr[0] - 4 || y > yr[1] + 4) { pen = false; continue; } d += (pen ? 'L' : 'M') + sx(x).toFixed(1) + ' ' + sy(y).toFixed(1); pen = true; }
    c += `<path class="cv ${cv.cls || ''}" d="${d}"/>`;
  }
  let p = '';
